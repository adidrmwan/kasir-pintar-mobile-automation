# ============================================================
#  Device Farm (Android AVD) untuk SumoPod / VPS ber-KVM
#
#  WAJIB sebelum run:  host harus punya /dev/kvm
#    ls -l /dev/kvm && egrep -c '(vmx|svm)' /proc/cpuinfo
#  Jika tidak ada KVM, compose ini TIDAK akan berguna (emulator lambat/gagal).
#
#  Image budtmo/docker-android sudah membundel: emulator + Appium + noVNC.
#  Tiap node mendaftar ke Selenium Grid Hub → paralel = tambah node.
#
#  Catatan: cek tag image terbaru di Docker Hub (budtmo/docker-android)
#  sebelum dipakai; tag di bawah bisa saja sudah bergeser.
# ============================================================
services:

  selenium-hub:
    image: selenium/hub:4.25.0
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"   # Grid endpoint → dipakai framework sebagai appium.server.url
    restart: unless-stopped

  android-node-1:
    image: budtmo/docker-android:emulator_11.0
    container_name: android-node-1
    privileged: true                 # butuh akses perangkat & modul
    devices:
      - /dev/kvm:/dev/kvm            # <-- inti akselerasi; gagal tanpa ini
    depends_on:
      - selenium-hub
    environment:
      - EMULATOR_DEVICE=Samsung Galaxy S10
      - WEB_VNC=true                 # tonton emulator via browser (debug)
      - APPIUM=true
      - CONNECT_TO_GRID=true
      - APPIUM_HOST=android-node-1
      - APPIUM_PORT=4723
      - SELENIUM_HOST=selenium-hub
      - SELENIUM_PORT=4444
      - MOBILE_WEB_TEST=false
    ports:
      - "6080:6080"                  # noVNC (lihat layar emulator)
    restart: unless-stopped

  # Tambah node untuk paralel: copy blok di atas, ganti nama/host/port.
  # android-node-2:
