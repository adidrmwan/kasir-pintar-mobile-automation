appium.server.url=http://127.0.0.1:4723
platform.name=Android
automation.name=UiAutomator2

device.name=Android Emulator
platform.version=

# app.path is intentionally EMPTY: the app is a split APK (no .aab), so Appium
# can't (re)install it via the `app` capability. Install it once beforehand
# (scripts/install-app.sh) and the framework attaches to it via app.package.
app.path=
app.package=org.owline.kasirpintarpro
app.activity=org.owline.kasirpintarpro.SplashScreen

no.reset=true
full.reset=false
new.command.timeout=120
auto.grant.permissions=true

implicit.wait=0
explicit.wait=20

login.email=CHANGE_ME
login.password=CHANGE_ME
