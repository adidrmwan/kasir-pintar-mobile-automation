name: Android Automation (Appium + Cucumber)

# ============================================================================
#  IMPORTANT — read before using:
#
#  1) APP ABI: the app splits we have are arm64-v8a. GitHub's Linux runners use
#     x86_64 emulators (KVM), which CANNOT run arm64 native code. So this
#     hosted-Linux job only works if you provide an x86_64/universal APK of the
#     app. If you only have the arm64 build, use the self-hosted job below
#     (a macOS Apple-Silicon machine, or your Mac) OR a cloud device farm.
#
#  2) APP DOWNLOAD: the APK is ~86MB — too big for a GitHub secret (48KB limit).
#     Host it (GitHub Release asset, S3, or an internal URL) and download it in
#     CI. Set secret APP_DOWNLOAD_URL to a zip that extracts to
#     src/test/resources/app/_splits/ (base.apk + split_config.*.apk), or to a
#     single universal .apk.
#
#  3) SECRETS: APP_DOWNLOAD_URL, LOGIN_EMAIL, LOGIN_PASSWORD.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags (e.g. @create or "@update or @delete")'
        required: false
        default: '@barang'
  schedule:
    - cron: '0 2 * * 1'

jobs:
  # --------------------------------------------------------------------------
  #  Option A — GitHub-hosted Linux emulator (needs an x86_64/universal APK)
  # --------------------------------------------------------------------------
  android-test:
    # arm64 Linux runner so we can run an arm64-v8a emulator that matches the
    # app's native libs (the app is arm64-only). Experimental: arm64 hosted
    # runners + Android emulator are newer/less battle-tested than x86.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # Secrets (LOGIN_EMAIL/PASSWORD) and variable APP_DRIVE_ID live in the "dev"
    # environment; this line makes them resolvable via secrets.* / vars.*
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 33 ]
    env:
      APP_PACKAGE: org.owline.kasirpintarpro

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Appium + UiAutomator2 driver
        run: |
          # Pin a known-good pair: the latest uiautomator2 now requires Appium 3,
          # which is incompatible with Appium 2.x. 2.19.0 + uiautomator2 3.7.4 match.
          npm install -g appium@2.19.0
          appium driver install uiautomator2@3.7.4
          appium --version

      # Download the app from a PUBLIC Google Drive file (too big for a secret).
      # Set repo variable APP_DRIVE_ID to the Drive file id. The file should be
      # EITHER a zip of the 3 splits (base + arm64 + xxhdpi) OR a universal .apk.
      # A base-only APK will fail to install (INSTALL_FAILED_MISSING_SPLIT).
      - name: Download app from Google Drive
        env:
          FILE_ID: ${{ vars.APP_DRIVE_ID || '1CtOQvxVdsOpEduyfaCyQdO7oi9onbHL5' }}
        run: |
          mkdir -p src/test/resources/app
          curl -sL "https://drive.usercontent.google.com/download?id=${FILE_ID}&confirm=t" -o app-bundle
          if unzip -l app-bundle | grep -qE '\.apk$'; then
            echo "Detected a zip of split APKs"
            mkdir -p src/test/resources/app/_splits
            unzip -o app-bundle -d src/test/resources/app/_splits
          else
            echo "Detected a single (universal/base) APK"
            mv app-bundle src/test/resources/app/universal.apk
          fi
          ls -R src/test/resources/app

      - name: Run automation on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TAGS: ${{ github.event.inputs.tags || '@barang' }}
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          # Keep the emulator script a SINGLE command — multi-line if/fi here can
          # break inside the action. All logic lives in scripts/ci-run.sh.
          script: bash scripts/ci-run.sh

      - name: Upload reports & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            target/cucumber-report/
            allure-results/
            appium.log
          if-no-files-found: ignore
